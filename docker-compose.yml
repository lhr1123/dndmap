services:
  postgres:
    image: postgres:16-alpine
    container_name: dnd-battle-map-postgres
    environment:
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
      POSTGRES_DB: dnd_battle_map
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_battle_map"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
